name: Test macOS

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  macos-tests:
    name: macos-tests
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Runtime check
        run: uv run splitshot --check
      - name: Run tests
        id: run_tests
        continue-on-error: true
        run: uv run python scripts/testing/run_test_suite.py --mode all-together --format table --raw-output artifacts/test-run.raw.txt --json-output artifacts/test-run.json --suite analysis --suite cli --suite export --suite media --suite persistence --suite presentation --suite scoring --suite benchmarks --suite scripts
      - name: Print raw output on failure
        if: steps.run_tests.outcome == 'failure'
        run: python -c "from pathlib import Path; print(Path('artifacts/test-run.raw.txt').read_text(encoding='utf-8'))"
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos
          path: artifacts/
      - name: Fail when tests fail
        if: steps.run_tests.outcome == 'failure'
        run: exit 1

  macos-electron-package:
    if: github.event_name != 'pull_request'
    name: macos-electron-package
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Install Python dependencies
        run: uv sync --frozen --extra dev
      - name: Install Node dependencies
        run: cd electron && npm install
        timeout-minutes: 10
      - name: Prepare macOS signing certificate
        env:
          MAC_CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          [ -z "${MAC_CERT_BASE64}" ] && { echo "Missing cert secret"; exit 0; }
          [ -z "${MAC_CERT_PASSWORD}" ] && { echo "Missing password secret"; exit 0; }
          tmp_dir="$(mktemp -d)"; cert_file="${tmp_dir}/developer-id.p12"
          keychain_file="${tmp_dir}/splitshot-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24 | tr -d '\n')"
          CERT_FILE="${cert_file}" MAC_CERT_BASE64="${MAC_CERT_BASE64}" python3 -c "import base64,os;from pathlib import Path;Path(os.environ['CERT_FILE']).write_bytes(base64.b64decode(os.environ['MAC_CERT_BASE64']))"
          security create-keychain -p "${keychain_password}" "${keychain_file}"
          security unlock-keychain -p "${keychain_password}" "${keychain_file}"
          security set-keychain-settings "${keychain_file}"
          security list-keychains -d user -s "${keychain_file}" $(security list-keychains -d user | tr -d '"')
          security import "${cert_file}" -k "${keychain_file}" -T /usr/bin/codesign -T /usr/bin/productbuild -P "${MAC_CERT_PASSWORD}" && echo "Cert imported" || echo "Cert import skipped"
          { echo "MAC_CERT_FILE=${cert_file}"; echo "MAC_CERT_KEYCHAIN=${keychain_file}"; echo "MAC_CERT_TMPDIR=${tmp_dir}"; echo "MAC_CERT_PASSWORD=${MAC_CERT_PASSWORD}"; } >> "${GITHUB_ENV}"
      - name: Prepare macOS notarization credentials
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          api_any=0
          fallback_any=0
          [[ -n "${APPLE_API_KEY:-}" || -n "${APPLE_API_KEY_ID:-}" || -n "${APPLE_API_ISSUER:-}" ]] && api_any=1
          [[ -n "${APPLE_ID:-}" || -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" || -n "${APPLE_TEAM_ID:-}" ]] && fallback_any=1
          if [[ "${api_any}" -eq 1 ]]; then
            [[ -n "${APPLE_API_KEY:-}" && -n "${APPLE_API_KEY_ID:-}" && -n "${APPLE_API_ISSUER:-}" ]] || {
              echo "Incomplete Apple API key notarization secrets"; exit 1;
            }
            api_key_file="${MAC_CERT_TMPDIR}/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s\n' "${APPLE_API_KEY}" > "${api_key_file}"
            chmod 600 "${api_key_file}"
            {
              echo "APPLE_API_KEY=${api_key_file}"
              echo "APPLE_API_KEY_ID=${APPLE_API_KEY_ID}"
              echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}"
            } >> "${GITHUB_ENV}"
          elif [[ "${fallback_any}" -eq 1 ]]; then
            [[ -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]] || {
              echo "Incomplete Apple ID notarization secrets"; exit 1;
            }
            {
              echo "APPLE_ID=${APPLE_ID}"
              echo "APPLE_APP_SPECIFIC_PASSWORD=${APPLE_APP_SPECIFIC_PASSWORD}"
              echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}"
            } >> "${GITHUB_ENV}"
          else
            echo "No Apple notarization credentials configured"; exit 1
          fi
      - name: Build Electron app
        run: |
          export CSC_LINK="${MAC_CERT_FILE}" CSC_KEY_PASSWORD="${MAC_CERT_PASSWORD}"
          cd electron && npm run build:mac
        timeout-minutes: 30
      - name: Verify notarization
        run: |
          app=$(ls electron/build/*/SplitShot.app | head -n 1)
          xcrun stapler validate "$app"
          spctl --assess --type execute -vv "$app"
      - uses: actions/upload-artifact@v7
        with:
          name: splitshot-macos
          path: electron/build/*.dmg
      - name: Cleanup macOS signing artifacts
        if: always()
        run: |
          [ -n "${MAC_CERT_KEYCHAIN:-}" ] && [ -f "${MAC_CERT_KEYCHAIN}" ] && security delete-keychain "${MAC_CERT_KEYCHAIN}" || true
          [ -n "${MAC_CERT_TMPDIR:-}" ] && [ -d "${MAC_CERT_TMPDIR}" ] && rm -rf "${MAC_CERT_TMPDIR}"

  macos-electron-validate:
    if: github.event_name != 'pull_request'
    needs: macos-electron-package
    name: macos-electron-validate
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: uv sync --frozen --extra dev
      - name: Install Node dependencies
        run: cd electron && npm install
        timeout-minutes: 10
      - name: Install Playwright browsers
        run: |
          uv run python -m playwright install --with-deps chromium
          cd electron && npx playwright install chromium
        timeout-minutes: 15
      - uses: actions/download-artifact@v5
        with:
          name: splitshot-macos
          path: electron/build
      - name: Validate DMG package
        run: |
          artifact=$(ls electron/build/*.dmg | head -n 1)
          uv run python scripts/testing/test_packaged_artifact.py --artifact "$artifact"
      - name: Full E2E test with DMG package
        run: |
          artifact=$(ls electron/build/*.dmg | head -n 1)
          uv run python scripts/testing/test_packaged_artifact.py --artifact "$artifact" --script scripts/testing/test_packaged_app_e2e.py
        timeout-minutes: 30
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-macos
          path: artifacts/
