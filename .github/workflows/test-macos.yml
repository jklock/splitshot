name: Test macOS

on:
  push:
    tags:
      - 'test-macos'
  workflow_dispatch:

jobs:
  unit:
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Runtime check
        run: uv run splitshot --check
      - name: Run tests
        id: run_tests
        continue-on-error: true
        run: uv run python scripts/testing/run_test_suite.py --mode all-together --format table --raw-output artifacts/test-run.raw.txt --json-output artifacts/test-run.json --suite analysis --suite cli --suite export --suite media --suite persistence --suite presentation --suite scoring --suite benchmarks --suite scripts
      - name: Print raw output on failure
        if: steps.run_tests.outcome == 'failure'
        run: python -c "from pathlib import Path; print(Path('artifacts/test-run.raw.txt').read_text(encoding='utf-8'))"
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos
          path: artifacts/
      - name: Fail when tests fail
        if: steps.run_tests.outcome == 'failure'
        run: exit 1

  electron-smoke:
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Install Python dependencies
        run: uv sync --frozen --extra dev
      - name: Install Node dependencies
        run: cd electron && npm install
        timeout-minutes: 10
      - name: Install Playwright browsers
        run: |
          uv run python -m playwright install --with-deps chromium
          cd electron && npx playwright install chromium
        timeout-minutes: 15
      - name: Prepare macOS signing certificate
        env:
          MAC_CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          [ -z "${MAC_CERT_BASE64}" ] && { echo "Missing cert secret"; exit 0; }
          [ -z "${MAC_CERT_PASSWORD}" ] && { echo "Missing password secret"; exit 0; }
          tmp_dir="$(mktemp -d)"; cert_file="${tmp_dir}/developer-id.p12"
          keychain_file="${tmp_dir}/splitshot-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24 | tr -d '\n')"
          CERT_FILE="${cert_file}" MAC_CERT_BASE64="${MAC_CERT_BASE64}" python3 -c "import base64,os;from pathlib import Path;Path(os.environ['CERT_FILE']).write_bytes(base64.b64decode(os.environ['MAC_CERT_BASE64']))"
          security create-keychain -p "${keychain_password}" "${keychain_file}"
          security unlock-keychain -p "${keychain_password}" "${keychain_file}"
          security set-keychain-settings "${keychain_file}"
          security list-keychains -d user -s "${keychain_file}" $(security list-keychains -d user | tr -d '"')
          security import "${cert_file}" -k "${keychain_file}" -T /usr/bin/codesign -T /usr/bin/productbuild -P "${MAC_CERT_PASSWORD}" && echo "Cert imported" || echo "Cert import skipped"
          { echo "MAC_CERT_FILE=${cert_file}"; echo "MAC_CERT_KEYCHAIN=${keychain_file}"; echo "MAC_CERT_TMPDIR=${tmp_dir}"; echo "MAC_CERT_PASSWORD=${MAC_CERT_PASSWORD}"; } >> "${GITHUB_ENV}"
      - name: Use unpacked build
        run: |
          shopt -s nullglob; apps=( electron/build/*/SplitShot.app )
          if [ ${#apps[@]} -eq 0 ]; then echo "No .app found"; exit 0; fi
          echo "APP_EXECUTABLE=${apps[0]}/Contents/MacOS/SplitShot" >> "${GITHUB_ENV}"
      - name: Build Electron app
        run: |
          export CSC_LINK="${MAC_CERT_FILE}" CSC_KEY_PASSWORD="${MAC_CERT_PASSWORD}"
          cd electron && npm run build:smoke:mac
        timeout-minutes: 30
      - name: Full E2E test with Playwright
        run: |
          if [ -f "${APP_EXECUTABLE}" ]; then
            uv run python scripts/testing/test_packaged_app_e2e.py --app "${APP_EXECUTABLE}"
          else
            echo "No app executable found, skipping E2E"
          fi
        timeout-minutes: 30
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-macos
          path: artifacts/
      - name: Cleanup macOS signing artifacts
        if: always()
        run: |
          [ -n "${MAC_CERT_KEYCHAIN:-}" ] && [ -f "${MAC_CERT_KEYCHAIN}" ] && security delete-keychain "${MAC_CERT_KEYCHAIN}" || true
          [ -n "${MAC_CERT_TMPDIR:-}" ] && [ -d "${MAC_CERT_TMPDIR}" ] && rm -rf "${MAC_CERT_TMPDIR}"
