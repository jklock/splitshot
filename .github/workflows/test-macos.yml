name: Test macOS

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  macos-tests:
    name: macos-tests
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Runtime check
        run: uv run splitshot --check
      - name: Run tests
        id: run_tests
        continue-on-error: true
        run: uv run python scripts/testing/run_test_suite.py --mode all-together --format table --raw-output artifacts/test-run.raw.txt --json-output artifacts/test-run.json --suite analysis --suite cli --suite export --suite media --suite persistence --suite presentation --suite scoring --suite benchmarks --suite scripts
      - name: Print raw output on failure
        if: steps.run_tests.outcome == 'failure'
        run: python -c "from pathlib import Path; print(Path('artifacts/test-run.raw.txt').read_text(encoding='utf-8'))"
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos
          path: artifacts/
      - name: Fail when tests fail
        if: steps.run_tests.outcome == 'failure'
        run: exit 1

  macos-electron-package:
    if: github.event_name != 'pull_request'
    name: macos-electron-package
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      SPLITSHOT_MAC_NOTARIZE: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Verify Electron CI inputs
        run: python scripts/testing/verify_electron_ci_inputs.py
      - name: Install Python dependencies
        run: uv sync --frozen --extra dev
      - name: Verify committed release corpus
        run: uv run python scripts/testing/validate_release_data.py
      - name: Install Node dependencies
        run: cd electron && npm ci
        timeout-minutes: 10
      - name: Prepare macOS signing certificate
        env:
          MAC_CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          [ -z "${MAC_CERT_BASE64}" ] && { echo "Missing cert secret"; exit 0; }
          [ -z "${MAC_CERT_PASSWORD}" ] && { echo "Missing password secret"; exit 0; }
          tmp_dir="$(mktemp -d)"; cert_file="${tmp_dir}/developer-id.p12"
          keychain_file="${tmp_dir}/splitshot-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24 | tr -d '\n')"
          CERT_FILE="${cert_file}" MAC_CERT_BASE64="${MAC_CERT_BASE64}" python3 -c "import base64,os;from pathlib import Path;Path(os.environ['CERT_FILE']).write_bytes(base64.b64decode(os.environ['MAC_CERT_BASE64']))"
          security create-keychain -p "${keychain_password}" "${keychain_file}"
          security unlock-keychain -p "${keychain_password}" "${keychain_file}"
          security set-keychain-settings "${keychain_file}"
          security list-keychains -d user -s "${keychain_file}" $(security list-keychains -d user | tr -d '"')
          security import "${cert_file}" -k "${keychain_file}" -T /usr/bin/codesign -T /usr/bin/productbuild -P "${MAC_CERT_PASSWORD}" && echo "Cert imported" || echo "Cert import skipped"
          { echo "MAC_CERT_FILE=${cert_file}"; echo "MAC_CERT_KEYCHAIN=${keychain_file}"; echo "MAC_CERT_TMPDIR=${tmp_dir}"; echo "MAC_CERT_PASSWORD=${MAC_CERT_PASSWORD}"; } >> "${GITHUB_ENV}"
      - name: Build Electron app
        run: |
          export CSC_LINK="${MAC_CERT_FILE}" CSC_KEY_PASSWORD="${MAC_CERT_PASSWORD}"
          cd electron && npm run build:mac
        timeout-minutes: 30
      - name: Verify signed app bundle
        run: |
          app=$(find electron/build -maxdepth 2 -type d -name 'SplitShot.app' | head -n 1)
          [ -n "$app" ] || { echo "SplitShot.app not found under electron/build"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
      - uses: actions/upload-artifact@v7
        with:
          name: splitshot-macos
          path: electron/build/*.dmg
      - name: Cleanup macOS signing artifacts
        if: always()
        run: |
          [ -n "${MAC_CERT_KEYCHAIN:-}" ] && [ -f "${MAC_CERT_KEYCHAIN}" ] && security delete-keychain "${MAC_CERT_KEYCHAIN}" || true
          [ -n "${MAC_CERT_TMPDIR:-}" ] && [ -d "${MAC_CERT_TMPDIR}" ] && rm -rf "${MAC_CERT_TMPDIR}"

  macos-electron-validate:
    if: github.event_name != 'pull_request'
    needs: macos-electron-package
    name: macos-electron-validate
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify Electron CI inputs
        run: python scripts/testing/verify_electron_ci_inputs.py
      - name: Install Python dependencies
        run: uv sync --frozen --extra dev
      - name: Install Node dependencies
        run: cd electron && npm ci
        timeout-minutes: 10
      - name: Install Playwright browsers
        run: |
          uv run python -m playwright install --with-deps chromium
          cd electron && npx playwright install chromium
        timeout-minutes: 15
      - name: Install OCR proof tool
        run: command -v tesseract >/dev/null 2>&1 || brew install tesseract
      - uses: actions/download-artifact@v5
        with:
          name: splitshot-macos
          path: electron/build
      - name: Validate DMG package
        run: |
          artifact=$(ls electron/build/*.dmg | head -n 1)
          uv run python scripts/testing/test_packaged_artifact.py --artifact "$artifact"
      - name: Full E2E test with DMG package
        run: |
          artifact=$(ls electron/build/*.dmg | head -n 1)
          uv run python scripts/testing/test_packaged_artifact.py \
            --artifact "$artifact" \
            --script scripts/testing/test_packaged_app_e2e.py \
            --script-arg=--scope \
            --script-arg=release-proof \
            --script-arg=--artifact-root \
            --script-arg=artifacts/v107-release-proof/github-review/macos \
            --script-arg=--primary-video \
            --script-arg=tests/release_data/primary.MP4 \
            --script-arg=--secondary-video \
            --script-arg=tests/release_data/secondary.MP4 \
            --script-arg=--practiscore \
            --script-arg=tests/release_data/practiscore.csv
        timeout-minutes: 180
      - name: Enforce exhaustive macOS evidence
        run: uv run python scripts/testing/build_packaged_release_summary.py --platform macos --artifact-root artifacts/v107-release-proof/github-review/macos
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-macos
          path: artifacts/
