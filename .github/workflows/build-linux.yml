name: Build Linux

on:
  workflow_dispatch:
  workflow_call:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install managed Python 3.12
        run: uv python install 3.12
      - name: Verify Electron CI inputs
        run: python scripts/testing/verify_electron_ci_inputs.py
      - name: Install system dependencies without ffmpeg
        run: sudo env SKIP_FFMPEG=1 bash scripts/testing/install_ci_linux_deps.sh
      - name: Verify host toolchain
        run: python3 --version; node --version; npm --version; uv --version
      - name: Sync Python dependencies
        run: uv sync --frozen --extra dev --python 3.12
        timeout-minutes: 15
      - name: Install Node dependencies
        run: cd electron && npm install
        timeout-minutes: 10
      - name: Build Electron app
        run: cd electron && npm run build:linux
        timeout-minutes: 30
      - name: Verify installer
        run: |
          shopt -s nullglob; found=( electron/build/*.AppImage )
          [ ${#found[@]} -eq 0 ] && { echo "No AppImage"; exit 1; }
          ls -lh "${found[@]}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: splitshot-linux
          path: electron/build/*.AppImage

  validate:
    needs: package
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install managed Python 3.12
        run: uv python install 3.12
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify Electron CI inputs
        run: python scripts/testing/verify_electron_ci_inputs.py
      - name: Install system dependencies
        run: sudo env SKIP_FFMPEG=1 bash scripts/testing/install_ci_linux_deps.sh
      - name: Sync Python dependencies
        run: uv sync --frozen --extra dev --python 3.12
      - name: Install Node dependencies
        run: cd electron && npm install
      - name: Install Playwright browsers
        run: |
          uv run python -m playwright install --with-deps chromium
          cd electron && npx playwright install chromium
      - uses: actions/download-artifact@v5
        with:
          name: splitshot-linux
          path: electron/build
      - name: Validate AppImage package
        run: |
          export LD_LIBRARY_PATH="/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH}"
          artifact=$(ls electron/build/*.AppImage | head -n 1)
          xvfb-run -a uv run python scripts/testing/test_packaged_artifact.py --artifact "$artifact"
      - name: Full E2E test with AppImage package
        run: |
          export LD_LIBRARY_PATH="/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH}"
          artifact=$(ls electron/build/*.AppImage | head -n 1)
          xvfb-run -a uv run python scripts/testing/test_packaged_artifact.py \
            --artifact "$artifact" \
            --script scripts/testing/test_packaged_app_e2e.py \
            --script-arg=--scope \
            --script-arg=release-proof \
            --script-arg=--artifact-root \
            --script-arg=artifacts/v106-phase-12-proof/github-review/linux \
            --script-arg=--primary-video \
            --script-arg=docs/Clip1.MP4
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-linux
          path: artifacts/
