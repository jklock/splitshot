name: Build Electron

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: "Remote target to package"
        type: choice
        required: true
        default: linux
        options:
          - linux
          - windows

jobs:
  package-linux:
    if: github.event_name == 'push' || github.event.inputs.target == 'linux'
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify host toolchain
        run: |
          python3 --version
          node --version
          npm --version
          uv --version

      - name: Install managed Python 3.12
        run: uv python install 3.12

      - name: Install system dependencies
        run: sudo bash scripts/testing/install_ci_linux_deps.sh

      - name: Sync Python dependencies
        run: uv sync --frozen --extra dev --python 3.12
        timeout-minutes: 15

      - name: Bundle Python
        run: node scripts/bundle-python.js
        timeout-minutes: 20

      - name: Verify bundle
        run: node scripts/bundle-python.js check

      - name: Install Node dependencies
        run: cd electron && npm install
        timeout-minutes: 10

      - name: Build Electron app
        run: cd electron && npm run build
        timeout-minutes: 30

      - name: Run packaged Electron smoke test
        run: xvfb-run -a uv run python scripts/testing/test_electron_app.py
        timeout-minutes: 10

      - name: Verify installer
        run: |
          shopt -s nullglob extglob
          found=( electron/build/*.AppImage )
          if [ ${#found[@]} -eq 0 ]; then
            echo "No Linux installers found in electron/build/"
            exit 1
          fi
          for f in "${found[@]}"; do
            ls -lh "$f"
          done

      - name: Verify Linux artifact metadata
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=( electron/build/*.AppImage )
          if [ ${#appimages[@]} -eq 0 ]; then
            echo "No AppImage found for metadata verification"
            exit 1
          fi
          tmp_dir="$(mktemp -d)"
          chmod +x "${appimages[0]}"
          (
            cd "${tmp_dir}"
            "${GITHUB_WORKSPACE}/${appimages[0]}" --appimage-extract >/dev/null
          )
          desktop_file="$(find "${tmp_dir}/squashfs-root" -name '*.desktop' | head -n 1)"
          if [ -z "${desktop_file}" ]; then
            echo "No desktop file found in AppImage"
            exit 1
          fi
          grep -q 'application/x-splitshot-project' "${desktop_file}"
          grep -q 'x-scheme-handler/splitshot' "${desktop_file}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: splitshot-linux
          path: electron/build/*.AppImage

  package-windows:
    if: github.event_name == 'push' || github.event.inputs.target == 'windows'
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify host toolchain
        run: |
          python --version
          node --version
          npm --version
          uv --version

      - name: Install system dependencies
        run: choco install ffmpeg -y --no-progress
        timeout-minutes: 5

      - name: Sync Python dependencies
        run: uv sync --extra dev
        timeout-minutes: 15

      - name: Bundle Python
        run: node scripts/bundle-python.js
        timeout-minutes: 20

      - name: Verify bundle
        run: node scripts/bundle-python.js check

      - name: Install Node dependencies
        run: cd electron && npm install
        timeout-minutes: 10

      - name: Build Electron app
        run: cd electron && npm run build
        timeout-minutes: 30

      - name: Run packaged Electron smoke test
        run: uv run python scripts/testing/test_electron_app.py
        timeout-minutes: 10

      - name: Verify installer
        run: |
          shopt -s nullglob extglob
          found=( electron/build/*.exe )
          if [ ${#found[@]} -eq 0 ]; then
            echo "No Windows installers found in electron/build/"
            exit 1
          fi
          for f in "${found[@]}"; do
            ls -lh "$f"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: splitshot-windows
          path: electron/build/*.exe

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - package-linux
      - package-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: splitshot-*/*
          generate_release_notes: true
