name: Build Electron

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install uv
        run: pip install uv

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ffmpeg \
            libxcb-cursor0 libxkbcommon-x11-0 \
            libegl1 libegl-mesa0 libgl1 \
            libxrandr2 libglib2.0-0 libfontconfig1 \
            libdbus-1-3 libx11-xcb1 libpulse0 libopengl0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libgtk-3-0 libnotify4 libnss3 libnspr4 \
            libxss1 libxtst6 libasound2t64 \
            libdrm2 libgbm1 libatspi2.0-0 libcups2 \
            build-essential python3-dev \
            libblas-dev liblapack-dev gfortran \
            libssl-dev pkg-config curl

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
        timeout-minutes: 5

      - name: Sync Python dependencies
        run: uv sync --extra dev
        timeout-minutes: 15

      - name: Verify CLI
        run: uv run splitshot --check

      - name: Bundle Python
        run: node scripts/bundle-python.js
        timeout-minutes: 20

      - name: Verify bundle
        run: node scripts/bundle-python.js check

      - name: Install Node dependencies
        run: cd electron && npm install
        timeout-minutes: 10

      - name: Run parity audit
        run: uv run python scripts/audits/electron_parity_audit.py --mode parity

      - name: Build Electron app (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 30
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          cd electron

          # 1. Import signing cert to a temp keychain that we control
          KC=/tmp/splitshot-sign.keychain
          KCP=splitshot
          security create-keychain -p "$KCP" "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          security default-keychain -s "$KC"
          echo "$CSC_LINK" | base64 -d > /tmp/devid.p12
          security import /tmp/devid.p12 -k "$KC" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCP" "$KC"
          rm -f /tmp/devid.p12
          CERT="Developer ID Application: John Klockenkemper (7DJ75AWV5R)"

          # 2. Package .app (electron-builder signs outer .app with our cert)
          npx electron-builder --mac --dir --publish=never

          # 3. Sign individual binaries one-by-one (--deep is broken)
          APP="build/mac-arm64/SplitShot.app"
          # 3a. Main executable
          codesign --force --options runtime --timestamp -s "$CERT" "$APP/Contents/MacOS/SplitShot"
          # 3b. Helper executables (inside the helper .apps)
          for h in "$APP/Contents/Frameworks/"*.app; do
            [ -d "$h" ] && codesign --force --options runtime --timestamp -s "$CERT" "$h/Contents/MacOS/$(basename "$h" .app)" 2>/dev/null || true
          done
          # 3c. Framework binaries
          for fw in "$APP/Contents/Frameworks/"*.framework; do
            [ -d "$fw" ] && codesign --force --options runtime --timestamp -s "$CERT" "$fw" 2>/dev/null || true
          done
          # 3d. Electron framework dylibs
          find "$APP/Contents/Frameworks" -name "*.dylib" -type f -print0 | \
            xargs -0 -I{} codesign --force --options runtime --timestamp \
              -s "$CERT" "{}" 2>/dev/null || true
          # 3e. Python bundle
          find "$APP/Contents/Resources/bundle" -name "python*" -type f -print0 | \
            xargs -0 -I{} codesign --force --options runtime --timestamp \
              -s "$CERT" "{}" 2>/dev/null || true
          # 3f. Re-sign outer .app
          codesign --force --options runtime --timestamp -s "$CERT" "$APP"

          # 4. Create DMG
          DMG="build/SplitShot-1.1.0-arm64.dmg"
          hdiutil create -volname "SplitShot" -fs HFS+ -srcfolder "$APP" "$DMG"

          # 5. Notarize + staple
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple "$DMG"

          # 6. Clean up
          security default-keychain -s ~/Library/Keychains/login.keychain-db
          security delete-keychain "$KC"

      - name: Build Electron app (Windows/Linux)
        if: runner.os != 'macOS'
        run: cd electron && npx electron-builder --publish=never
        timeout-minutes: 30

      - name: Build Electron app (Windows/Linux)
        if: runner.os != 'macOS'
        run: cd electron && npm run build
        timeout-minutes: 30

      - name: Verify installer
        shell: bash
        run: |
          shopt -s nullglob extglob
          found=( electron/build/*.@(dmg|exe|AppImage) )
          if [ ${#found[@]} -eq 0 ]; then
            echo "No installers found in electron/build/"
            exit 1
          fi
          for f in "${found[@]}"; do
            ls -lh "$f"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: splitshot-${{ runner.os }}
          path: |
            electron/build/*.dmg
            electron/build/*.exe
            electron/build/*.AppImage

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: splitshot-*/*
          generate_release_notes: true
