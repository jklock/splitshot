name: Build Release

on:
  push:
    tags:
      - 'build'
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new-version: ${{ steps.bump.outputs.new-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        id: bump
        run: |
          OLD_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          IFS='.' read -r MAJ MIN PAT <<< "$OLD_VERSION"
          PAT=$((PAT + 1))
          NEW_VERSION="${MAJ}.${MIN}.${PAT}"
          echo "old=$OLD_VERSION new=$NEW_VERSION"
          echo "new-version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          # Update pyproject.toml
          sed -i 's/^version = ".*"/version = "'"$NEW_VERSION"'"/' pyproject.toml
          # Update electron/package.json
          sed -i 's/"version": ".*"/"version": "'"$NEW_VERSION"'"/' electron/package.json

      - name: Commit version bump
        run: |
          git config user.name "splitshot-bot"
          git config user.email "bot@splitshot.studio"
          git add pyproject.toml electron/package.json
          git commit -m "release: v${{ steps.bump.outputs.new-version }}"
          git push

      - name: Create version tag
        run: |
          TAG="v${{ steps.bump.outputs.new-version }}"
          git tag -a "$TAG" -m "SplitShot $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.bump.outputs.new-version }}"
          gh release create "$TAG" \
            --title "SplitShot $TAG" \
            --notes "Automated release for $TAG" \
            --target main

  package-macos:
    needs: version
    runs-on: macos-14
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.new-version }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install managed Python 3.12
        run: uv python install 3.12
      - name: Install system dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then brew install ffmpeg; fi
      - name: Verify host toolchain
        run: python3 --version; node --version; npm --version; uv --version; ffmpeg -version | head -n 1
      - name: Sync Python dependencies
        run: uv sync --frozen --extra dev --python 3.12
        timeout-minutes: 15
      - name: Install Node dependencies
        run: cd electron && npm install
        timeout-minutes: 10
      - name: Prepare macOS signing certificate
        env:
          MAC_CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          [ -z "${MAC_CERT_BASE64}" ] && { echo "Missing cert"; exit 1; }
          [ -z "${MAC_CERT_PASSWORD}" ] && { echo "Missing password"; exit 1; }
          tmp_dir="$(mktemp -d)"; cert_file="${tmp_dir}/developer-id.p12"
          keychain_file="${tmp_dir}/splitshot-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24 | tr -d '\n')"
          CERT_FILE="${cert_file}" MAC_CERT_BASE64="${MAC_CERT_BASE64}" python3 -c "
          import base64, os; from pathlib import Path
          Path(os.environ['CERT_FILE']).write_bytes(base64.b64decode(os.environ['MAC_CERT_BASE64']))
          "
          openssl pkcs12 -in "${cert_file}" -info -noout -passin env:MAC_CERT_PASSWORD >/dev/null
          security create-keychain -p "${keychain_password}" "${keychain_file}"
          security unlock-keychain -p "${keychain_password}" "${keychain_file}"
          security set-keychain-settings "${keychain_file}"
          security list-keychains -d user -s "${keychain_file}" $(security list-keychains -d user | tr -d '"')
          security import "${cert_file}" -k "${keychain_file}" -T /usr/bin/codesign -T /usr/bin/productbuild -P "${MAC_CERT_PASSWORD}"
          security find-identity -v -p codesigning "${keychain_file}"
          { echo "MAC_CERT_FILE=${cert_file}"; echo "MAC_CERT_KEYCHAIN=${keychain_file}"; echo "MAC_CERT_TMPDIR=${tmp_dir}"; echo "MAC_CERT_PASSWORD=${MAC_CERT_PASSWORD}"; } >> "${GITHUB_ENV}"
      - name: Configure macOS notarization credentials
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -n "${APPLE_API_KEY}" ] || [ -n "${APPLE_API_KEY_ID}" ] || [ -n "${APPLE_API_ISSUER}" ]; then
            { echo "APPLE_API_KEY_ID=${APPLE_API_KEY_ID}"; echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}"; echo "APPLE_API_KEY<<__SPLITSHOT_API_KEY__"; printf '%s\n' "${APPLE_API_KEY}"; echo "__SPLITSHOT_API_KEY__"; } >> "${GITHUB_ENV}"
          elif [ -n "${APPLE_ID}" ] || [ -n "${APPLE_APP_SPECIFIC_PASSWORD}" ] || [ -n "${APPLE_TEAM_ID}" ]; then
            { echo "APPLE_ID=${APPLE_ID}"; echo "APPLE_APP_SPECIFIC_PASSWORD=${APPLE_APP_SPECIFIC_PASSWORD}"; echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}"; } >> "${GITHUB_ENV}"
          else
            echo "No notarization credentials; signing only."
          fi
      - name: Build Electron app
        run: |
          export CSC_LINK="${MAC_CERT_FILE}"
          export CSC_KEY_PASSWORD="${MAC_CERT_PASSWORD}"
          cd electron && npm run build:mac
        timeout-minutes: 30
        env:
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      - name: Verify installer
        run: |
          shopt -s nullglob; found=( electron/build/*.dmg )
          [ ${#found[@]} -eq 0 ] && { echo "No DMG"; exit 1; }
          ls -lh "${found[@]}"
      - name: Verify signed
        run: |
          shopt -s nullglob; apps=( electron/build/*/SplitShot.app )
          [ ${#apps[@]} -eq 0 ] && { echo "No .app"; exit 1; }
          for a in "${apps[@]}"; do codesign -dv "$a"; done
      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.version.outputs.new-version }}"
          shopt -s nullglob; files=( electron/build/*.dmg )
          for f in "${files[@]}"; do
            gh release upload "$TAG" "$f" --clobber
          done
      - name: Cleanup macOS signing artifacts
        run: |
          [ -n "${MAC_CERT_KEYCHAIN:-}" ] && [ -f "${MAC_CERT_KEYCHAIN}" ] && security delete-keychain "${MAC_CERT_KEYCHAIN}" || true
          [ -n "${MAC_CERT_TMPDIR:-}" ] && [ -d "${MAC_CERT_TMPDIR}" ] && rm -rf "${MAC_CERT_TMPDIR}"

  package-linux:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.new-version }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install managed Python 3.12
        run: uv python install 3.12
      - name: Install system dependencies
        run: sudo bash scripts/testing/install_ci_linux_deps.sh
      - name: Verify host toolchain
        run: python3 --version; node --version; npm --version; uv --version; ffmpeg -version | head -n 1
      - name: Sync Python dependencies
        run: uv sync --frozen --extra dev --python 3.12
        timeout-minutes: 15
      - name: Install Node dependencies
        run: cd electron && npm install
        timeout-minutes: 10
      - name: Build Electron app
        run: cd electron && npm run build:linux
        timeout-minutes: 30
      - name: Verify installer
        run: |
          shopt -s nullglob; found=( electron/build/*.AppImage )
          [ ${#found[@]} -eq 0 ] && { echo "No AppImage"; exit 1; }
          ls -lh "${found[@]}"
      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.version.outputs.new-version }}"
          shopt -s nullglob; files=( electron/build/*.AppImage )
          for f in "${files[@]}"; do
            gh release upload "$TAG" "$f" --clobber
          done

  package-windows:
    needs: version
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.new-version }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install managed Python 3.12
        run: uv python install 3.12
      - name: Verify host toolchain
        run: python3 --version; node --version; npm --version; uv --version; ffmpeg -version | head -n 1
      - name: Sync Python dependencies
        run: uv sync --frozen --extra dev --python 3.12
        timeout-minutes: 15
      - name: Install Node dependencies
        run: cd electron && npm install
        timeout-minutes: 10
      - name: Build Electron app
        run: cd electron && npm run build:win
        timeout-minutes: 30
      - name: Verify installer
        run: |
          shopt -s nullglob; found=( electron/build/*.exe )
          [ ${#found[@]} -eq 0 ] && { echo "No NSIS installer"; exit 1; }
          ls -lh "${found[@]}"
      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.version.outputs.new-version }}"
          shopt -s nullglob; files=( electron/build/*.exe )
          for f in "${files[@]}"; do
            gh release upload "$TAG" "$f" --clobber
          done
