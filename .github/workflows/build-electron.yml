name: Build Electron

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Platform target to package"
        type: choice
        required: true
        default: linux
        options:
          - all
          - macos
          - linux
          - windows
      publish_release:
        description: "Attach artifacts to a GitHub release"
        type: boolean
        required: true
        default: false
      release_tag:
        description: "Release tag (required when publish_release=true)"
        type: string
        required: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runs-on: macos-14
            build-command: npm run build:mac
            artifact-glob: electron/build/*.dmg
            artifact-name: splitshot-macos
            deps: brew
            smoke-prefix: ""

          - platform: linux
            runs-on: [self-hosted, Linux, X64]
            build-command: npm run build:linux
            artifact-glob: electron/build/*.AppImage
            artifact-name: splitshot-linux
            deps: linux-apt
            smoke-prefix: xvfb-run -a

          - platform: windows
            runs-on: [self-hosted, Windows, X64]
            build-command: npm run build:win
            artifact-glob: electron/build/*.exe
            artifact-name: splitshot-windows
            deps: windows-choco
            smoke-prefix: ""

    runs-on: ${{ matrix.runs-on }}

    if: |
      !cancelled() && (
        github.event_name != 'workflow_dispatch' ||
        github.event.inputs.target == 'all' ||
        github.event.inputs.target == matrix.platform
      )

    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Validate release publish inputs
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true'
        run: |
          set -euo pipefail
          if [ -z "${{ github.event.inputs.release_tag }}" ]; then
            echo "release_tag is required when publish_release=true"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install managed Python 3.12
        run: uv python install 3.12

      - name: Install system dependencies (macOS)
        if: matrix.deps == 'brew'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi

      - name: Install system dependencies (Linux)
        if: matrix.deps == 'linux-apt'
        run: sudo bash scripts/testing/install_ci_linux_deps.sh
        timeout-minutes: 15

      - name: Bootstrap runner toolchain (Windows)
        if: matrix.deps == 'windows-choco'
        run: powershell -ExecutionPolicy Bypass -File scripts/setup/setup_self_hosted_runner_windows.ps1
        timeout-minutes: 15

      - name: Verify host toolchain
        run: |
          python3 --version
          node --version
          npm --version
          uv --version
          ffmpeg -version | head -n 1

      - name: Sync Python dependencies
        run: uv sync --frozen --extra dev --python 3.12
        timeout-minutes: 15

      - name: Install Node dependencies
        run: cd electron && npm install
        timeout-minutes: 10

      - name: Prepare macOS signing certificate
        if: matrix.platform == 'macos'
        env:
          MAC_CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MAC_CERT_BASE64}" ]; then
            echo "Missing MAC_CERT_BASE64 secret"
            exit 1
          fi
          if [ -z "${MAC_CERT_PASSWORD}" ]; then
            echo "Missing MAC_CERT_PASSWORD secret"
            exit 1
          fi

          tmp_dir="$(mktemp -d)"
          cert_file="${tmp_dir}/developer-id.p12"
          keychain_file="${tmp_dir}/splitshot-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24 | tr -d '\n')"

          CERT_FILE="${cert_file}" MAC_CERT_BASE64="${MAC_CERT_BASE64}" python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["CERT_FILE"]).write_bytes(base64.b64decode(os.environ["MAC_CERT_BASE64"]))
          PY

          openssl pkcs12 -in "${cert_file}" -info -noout -passin env:MAC_CERT_PASSWORD >/dev/null

          security create-keychain -p "${keychain_password}" "${keychain_file}"
          security unlock-keychain -p "${keychain_password}" "${keychain_file}"
          security set-keychain-settings "${keychain_file}"
          security list-keychains -d user -s "${keychain_file}" $(security list-keychains -d user | tr -d '"')
          if ! security import "${cert_file}" -k "${keychain_file}" -T /usr/bin/codesign -T /usr/bin/productbuild -P "${MAC_CERT_PASSWORD}"; then
            echo "macOS rejected the .p12 during security import."
            echo "Re-export the Developer ID Application certificate from Keychain Access and confirm the private key is included."
            exit 1
          fi
          security find-identity -v -p codesigning "${keychain_file}"

          {
            echo "MAC_CERT_FILE=${cert_file}"
            echo "MAC_CERT_KEYCHAIN=${keychain_file}"
            echo "MAC_CERT_TMPDIR=${tmp_dir}"
            echo "MAC_CERT_PASSWORD=${MAC_CERT_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Configure macOS notarization credentials
        if: matrix.platform == 'macos'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_API_KEY}" ] || [ -n "${APPLE_API_KEY_ID}" ] || [ -n "${APPLE_API_ISSUER}" ]; then
            if [ -z "${APPLE_API_KEY}" ] || [ -z "${APPLE_API_KEY_ID}" ] || [ -z "${APPLE_API_ISSUER}" ]; then
              echo "APPLE_API_KEY, APPLE_API_KEY_ID, and APPLE_API_ISSUER must all be set together"
              exit 1
            fi
            {
              echo "APPLE_API_KEY_ID=${APPLE_API_KEY_ID}"
              echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}"
              echo "APPLE_API_KEY<<__SPLITSHOT_API_KEY__"
              printf '%s\n' "${APPLE_API_KEY}"
              echo "__SPLITSHOT_API_KEY__"
            } >> "${GITHUB_ENV}"
          elif [ -n "${APPLE_ID}" ] || [ -n "${APPLE_APP_SPECIFIC_PASSWORD}" ] || [ -n "${APPLE_TEAM_ID}" ]; then
            if [ -z "${APPLE_ID}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD}" ] || [ -z "${APPLE_TEAM_ID}" ]; then
              echo "APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID must all be set together"
              exit 1
            fi
            {
              echo "APPLE_ID=${APPLE_ID}"
              echo "APPLE_APP_SPECIFIC_PASSWORD=${APPLE_APP_SPECIFIC_PASSWORD}"
              echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}"
            } >> "${GITHUB_ENV}"
          else
            echo "No notarization credentials configured; build will sign but skip notarization."
          fi

      - name: Build Electron app
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "macos" ]; then
            export CSC_LINK="${MAC_CERT_FILE}"
            export CSC_KEY_PASSWORD="${MAC_CERT_PASSWORD}"
          fi
          cd electron
          ${{ matrix.build-command }}
        timeout-minutes: 30
        env:
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}

      - name: Run packaged Electron smoke test
        run: ${{ matrix.smoke-prefix }} uv run python scripts/testing/test_electron_app.py
        timeout-minutes: 10

      - name: Verify installer
        run: |
          shopt -s nullglob
          found=( ${{ matrix.artifact-glob }} )
          if [ ${#found[@]} -eq 0 ]; then
            echo "No ${{ matrix.platform }} installers found in electron/build/"
            exit 1
          fi
          for f in "${found[@]}"; do
            ls -lh "$f"
          done

      - name: Verify installer signed (macOS)
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=( electron/build/*/SplitShot.app )
          if [ ${#apps[@]} -eq 0 ]; then
            echo "No .app bundle found in electron/build/"
            exit 1
          fi
          for app in "${apps[@]}"; do
            codesign -dv "$app"
          done

      - name: Verify AppImage metadata (Linux)
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=( electron/build/*.AppImage )
          if [ ${#appimages[@]} -eq 0 ]; then
            echo "No AppImage found for metadata verification"
            exit 1
          fi
          tmp_dir="$(mktemp -d)"
          chmod +x "${appimages[0]}"
          (
            cd "${tmp_dir}"
            "${GITHUB_WORKSPACE}/${appimages[0]}" --appimage-extract >/dev/null
          )
          desktop_file="$(find "${tmp_dir}/squashfs-root" -name '*.desktop' | head -n 1)"
          if [ -z "${desktop_file}" ]; then
            echo "No desktop file found in AppImage"
            exit 1
          fi
          grep -q 'application/x-splitshot-project' "${desktop_file}"
          grep -q 'x-scheme-handler/splitshot' "${desktop_file}"

      - name: Verify installer metadata (Windows)
        if: matrix.platform == 'windows'
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=( electron/build/*.exe )
          if [ ${#installers[@]} -eq 0 ]; then
            echo "No Windows installer found for metadata verification"
            exit 1
          fi
          powershell -ExecutionPolicy Bypass -Command "
            \$installer = Get-Item '${installers[0]}'
            \$version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo(\$installer.FullName)
            Write-Output \"File: \$(\$installer.Name)\"
            Write-Output \"Size: \$(\$installer.Length) bytes\"
            Write-Output \"ProductName: \$(\$version.ProductName)\"
            Write-Output \"FileVersion: \$(\$version.FileVersion)\"
            if (-not \$version.ProductName -or \$version.ProductName -notlike '*SplitShot*') {
              Write-Error 'Installer ProductName does not contain SplitShot'
              exit 1
            }
          "

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-glob }}

      - name: Publish release artifacts
        if: >
          (github.event_name == 'release') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ matrix.artifact-glob }}
          generate_release_notes: ${{ github.event_name == 'release' }}

      - name: Cleanup macOS signing artifacts
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          if [ -n "${MAC_CERT_KEYCHAIN:-}" ] && [ -f "${MAC_CERT_KEYCHAIN}" ]; then
            security delete-keychain "${MAC_CERT_KEYCHAIN}" || true
          fi
          if [ -n "${MAC_CERT_TMPDIR:-}" ] && [ -d "${MAC_CERT_TMPDIR}" ]; then
            rm -rf "${MAC_CERT_TMPDIR}"
          fi
