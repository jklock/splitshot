name: Runner Smoke

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Remote target to validate"
        type: choice
        required: true
        default: linux
        options:
          - linux
          - windows

jobs:
  smoke-linux:
    if: github.event.inputs.target == 'linux'
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Print runner details
        run: |
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          python3 --version
          node --version
          npm --version
          uv --version

      - name: Install managed Python 3.12
        run: uv python install 3.12

      - name: Install Linux runtime dependencies
        run: sudo bash scripts/testing/install_ci_linux_deps.sh

      - name: Verify CLI
        run: |
          uv sync --frozen --extra dev --python 3.12
          uv run splitshot --check

  smoke-windows:
    if: github.event.inputs.target == 'windows'
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bootstrap runner toolchain
        run: powershell -ExecutionPolicy Bypass -File scripts/setup/setup_self_hosted_runner_windows.ps1
        timeout-minutes: 15

      - name: Install managed Python 3.12
        run: uv python install 3.12

      - name: Print runner details
        run: |
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          node --version
          npm --version
          uv --version
          ffmpeg -version | head -n 1

      - name: Verify CLI
        run: |
          uv sync --frozen --extra dev --python 3.12
          uv run splitshot --check
