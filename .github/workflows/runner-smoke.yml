name: Runner Smoke

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Remote target to validate"
        type: choice
        required: true
        default: linux
        options:
          - linux
          - windows

jobs:
  smoke-linux:
    if: github.event.inputs.target == 'linux'
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install uv
        run: pip install uv

      - name: Print runner details
        run: |
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          python --version
          node --version
          uv --version

      - name: Verify CLI
        run: |
          uv sync --extra dev
          uv run splitshot --check

  smoke-windows:
    if: github.event.inputs.target == 'windows'
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install uv
        run: pip install uv

      - name: Print runner details
        run: |
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          python --version
          node --version
          uv --version

      - name: Verify CLI
        run: |
          uv sync --extra dev
          uv run splitshot --check
