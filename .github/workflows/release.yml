name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_ref:
        description: Git ref to build and publish
        required: true
        default: v1.0.1
      release_tag:
        description: Release tag to publish
        required: true
        default: v1.0.1

env:
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  macos:
    runs-on: macos-14
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install managed Python 3.12
        run: uv python install 3.12
      - name: Install system deps
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then brew install ffmpeg; fi
      - name: Sync Python deps
        run: uv sync --frozen --extra dev --python 3.12
        timeout-minutes: 15
      - name: Install Node deps
        run: cd electron && npm install
        timeout-minutes: 10
      - name: Prepare macOS signing certificate
        env:
          MAC_CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          [ -z "${MAC_CERT_BASE64}" ] && { echo "No cert secret"; exit 0; }
          tmp_dir="$(mktemp -d)"; cert_file="${tmp_dir}/developer-id.p12"
          keychain_file="${tmp_dir}/splitshot-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24 | tr -d '\n')"
          CERT_FILE="${cert_file}" MAC_CERT_BASE64="${MAC_CERT_BASE64}" python3 -c "import base64,os;from pathlib import Path;Path(os.environ['CERT_FILE']).write_bytes(base64.b64decode(os.environ['MAC_CERT_BASE64']))"
          security create-keychain -p "${keychain_password}" "${keychain_file}"
          security unlock-keychain -p "${keychain_password}" "${keychain_file}"
          security set-keychain-settings "${keychain_file}"
          security list-keychains -d user -s "${keychain_file}" $(security list-keychains -d user | tr -d '"')
          security import "${cert_file}" -k "${keychain_file}" -T /usr/bin/codesign -T /usr/bin/productbuild -P "${MAC_CERT_PASSWORD}"
          { echo "MAC_CERT_FILE=${cert_file}"; echo "MAC_CERT_KEYCHAIN=${keychain_file}"; echo "MAC_CERT_TMPDIR=${tmp_dir}"; echo "MAC_CERT_PASSWORD=${MAC_CERT_PASSWORD}"; } >> "${GITHUB_ENV}"
      - name: Build
        run: |
          export CSC_LINK="${MAC_CERT_FILE}" CSC_KEY_PASSWORD="${MAC_CERT_PASSWORD}"
          cd electron && npm run build:mac
        timeout-minutes: 30
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: splitshot-macos
          path: electron/build/*.dmg
      - name: Cleanup
        if: always()
        run: |
          [ -n "${MAC_CERT_KEYCHAIN:-}" ] && security delete-keychain "${MAC_CERT_KEYCHAIN}" || true
          [ -n "${MAC_CERT_TMPDIR:-}" ] && rm -rf "${MAC_CERT_TMPDIR}"

  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install managed Python 3.12
        run: uv python install 3.12
      - name: Install system deps
        run: sudo bash scripts/testing/install_ci_linux_deps.sh
      - name: Sync Python deps
        run: uv sync --frozen --extra dev --python 3.12
        timeout-minutes: 15
      - name: Install Node deps
        run: cd electron && npm install
        timeout-minutes: 10
      - name: Build
        run: cd electron && npm run build:linux
        timeout-minutes: 30
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: splitshot-linux
          path: electron/build/*.AppImage

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install managed Python 3.12
        run: uv python install 3.12
      - name: Verify host toolchain
        run: python3 --version; node --version; npm --version; uv --version; ffmpeg -version | head -n 1
      - name: Sync Python deps
        run: uv sync --frozen --extra dev --python 3.12
        timeout-minutes: 15
      - name: Install Node deps
        run: cd electron && npm install
        timeout-minutes: 10
      - name: Build
        run: cd electron && npm run build:win
        timeout-minutes: 30
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: splitshot-windows
          path: electron/build/*.exe

  publish:
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
      - name: Extract release notes
        run: |
          python3 scripts/release/extract_release_notes.py "${RELEASE_TAG}" --output artifacts/release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --title "SplitShot ${RELEASE_TAG#v}" \
            --notes-file artifacts/release-notes.md \
            --target "${RELEASE_REF}" \
            2>/dev/null || gh release edit "${RELEASE_TAG}" --notes-file artifacts/release-notes.md
          for dir in splitshot-macos splitshot-linux splitshot-windows; do
            [ -d "$dir" ] && for f in "$dir"/*; do
              gh release upload "${RELEASE_TAG}" "$f" --clobber
            done
          done
