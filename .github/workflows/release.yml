name: Release

on:
  push:
    tags:
      - 'release'

jobs:
  # === Step 1: Unit tests — all 3 platforms, parallel ===
  test-macos:
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Run tests
        run: uv run python scripts/testing/run_test_suite.py --mode all-together --format table --suite analysis --suite cli --suite export --suite media --suite persistence --suite presentation --suite scoring --suite benchmarks --suite scripts

  test-linux:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install system dependencies
        run: sudo bash scripts/testing/install_ci_linux_deps.sh
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Run tests
        run: uv run python scripts/testing/run_test_suite.py --mode all-together --format table --suite analysis --suite cli --suite export --suite media --suite persistence --suite presentation --suite scoring --suite benchmarks --suite scripts

  test-windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install FFmpeg
        run: choco install ffmpeg -y
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Run tests
        run: uv run python scripts/testing/run_test_suite.py --mode all-together --format table --suite analysis --suite cli --suite export --suite media --suite persistence --suite presentation --suite scoring --suite benchmarks --suite scripts

  # === Step 2: Build — each platform, depends on its test passing ===
  build-macos:
    needs: test-macos
    runs-on: macos-14
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install managed Python 3.12
        run: uv python install 3.12
      - name: Install system deps
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then brew install ffmpeg; fi
      - name: Sync Python deps
        run: uv sync --frozen --extra dev --python 3.12
        timeout-minutes: 15
      - name: Install Node deps
        run: cd electron && npm install
        timeout-minutes: 10
      - name: Prepare macOS signing certificate
        env:
          MAC_CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          [ -z "${MAC_CERT_BASE64}" ] && { echo "No cert secret"; exit 0; }
          tmp_dir="$(mktemp -d)"; cert_file="${tmp_dir}/developer-id.p12"
          keychain_file="${tmp_dir}/splitshot-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24 | tr -d '\n')"
          CERT_FILE="${cert_file}" MAC_CERT_BASE64="${MAC_CERT_BASE64}" python3 -c "import base64,os;from pathlib import Path;Path(os.environ['CERT_FILE']).write_bytes(base64.b64decode(os.environ['MAC_CERT_BASE64']))"
          security create-keychain -p "${keychain_password}" "${keychain_file}"
          security unlock-keychain -p "${keychain_password}" "${keychain_file}"
          security set-keychain-settings "${keychain_file}"
          security list-keychains -d user -s "${keychain_file}" $(security list-keychains -d user | tr -d '"')
          security import "${cert_file}" -k "${keychain_file}" -T /usr/bin/codesign -T /usr/bin/productbuild -P "${MAC_CERT_PASSWORD}"
          { echo "MAC_CERT_FILE=${cert_file}"; echo "MAC_CERT_KEYCHAIN=${keychain_file}"; echo "MAC_CERT_TMPDIR=${tmp_dir}"; echo "MAC_CERT_PASSWORD=${MAC_CERT_PASSWORD}"; } >> "${GITHUB_ENV}"
      - name: Build
        run: |
          export CSC_LINK="${MAC_CERT_FILE}" CSC_KEY_PASSWORD="${MAC_CERT_PASSWORD}"
          cd electron && npm run build:mac
        timeout-minutes: 30
      - name: Verify installer
        run: |
          shopt -s nullglob; d=( electron/build/*.dmg ); [ ${#d[@]} -eq 0 ] && { echo "No DMG"; exit 1; }; ls -lh "${d[@]}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: splitshot-macos
          path: electron/build/*.dmg
      - name: Cleanup
        if: always()
        run: |
          [ -n "${MAC_CERT_KEYCHAIN:-}" ] && security delete-keychain "${MAC_CERT_KEYCHAIN}" || true
          [ -n "${MAC_CERT_TMPDIR:-}" ] && rm -rf "${MAC_CERT_TMPDIR}"

  build-linux:
    needs: test-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install managed Python 3.12
        run: uv python install 3.12
      - name: Install system deps
        run: sudo bash scripts/testing/install_ci_linux_deps.sh
      - name: Sync Python deps
        run: uv sync --frozen --extra dev --python 3.12
        timeout-minutes: 15
      - name: Install Node deps
        run: cd electron && npm install
        timeout-minutes: 10
      - name: Build
        run: cd electron && npm run build:linux
        timeout-minutes: 30
      - name: Verify installer
        run: |
          shopt -s nullglob; a=( electron/build/*.AppImage ); [ ${#a[@]} -eq 0 ] && { echo "No AppImage"; exit 1; }; ls -lh "${a[@]}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: splitshot-linux
          path: electron/build/*.AppImage

  build-windows:
    needs: test-windows
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install managed Python 3.12
        run: uv python install 3.12
      - name: Verify host toolchain
        run: python3 --version; node --version; npm --version; uv --version; ffmpeg -version | head -n 1
      - name: Sync Python deps
        run: uv sync --frozen --extra dev --python 3.12
        timeout-minutes: 15
      - name: Install Node deps
        run: cd electron && npm install
        timeout-minutes: 10
      - name: Build
        run: cd electron && npm run build:win
        timeout-minutes: 30
      - name: Verify installer
        run: |
          shopt -s nullglob; e=( electron/build/*.exe ); [ ${#e[@]} -eq 0 ] && { echo "No NSIS"; exit 1; }; ls -lh "${e[@]}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: splitshot-windows
          path: electron/build/*.exe

  # === Step 3: Publish — create v1 tag + release, attach all installers ===
  publish:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Create v1 tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create v1 tag (delete existing if present)
          git push origin :refs/tags/v1 2>/dev/null || true
          git tag -a v1 -m "SplitShot V1"
          git push origin v1

          # Create GitHub Release
          gh release create v1 \
            --title "SplitShot V1" \
            --notes "SplitShot V1 release" \
            --target main

          # Upload all installers
          for dir in splitshot-macos splitshot-linux splitshot-windows; do
            [ -d "$dir" ] && for f in "$dir"/*; do
              gh release upload v1 "$f" --clobber
            done
          done
