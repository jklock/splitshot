name: Test Linux

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  linux-tests:
    name: linux-tests
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install system dependencies
        run: sudo bash scripts/testing/install_ci_linux_deps.sh
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Runtime check
        run: uv run splitshot --check
      - name: Run tests
        id: run_tests
        continue-on-error: true
        run: uv run python scripts/testing/run_test_suite.py --mode all-together --format table --raw-output artifacts/test-run.raw.txt --json-output artifacts/test-run.json --suite analysis --suite cli --suite export --suite media --suite persistence --suite presentation --suite scoring --suite benchmarks --suite scripts
      - name: Print raw output on failure
        if: steps.run_tests.outcome == 'failure'
        run: python -c "from pathlib import Path; print(Path('artifacts/test-run.raw.txt').read_text(encoding='utf-8'))"
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux
          path: artifacts/
      - name: Fail when tests fail
        if: steps.run_tests.outcome == 'failure'
        run: exit 1

  linux-electron-package:
    if: github.event_name != 'pull_request'
    name: linux-electron-package
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install system dependencies
        run: sudo bash scripts/testing/install_ci_linux_deps.sh
      - name: Install Python dependencies
        run: uv sync --frozen --extra dev
      - name: Install Node dependencies
        run: cd electron && npm install
        timeout-minutes: 10
      - name: Build Electron app
        run: cd electron && npm run build:linux
        timeout-minutes: 30
        env:
          LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH}
      - uses: actions/upload-artifact@v7
        with:
          name: splitshot-linux
          path: electron/build/*.AppImage

  linux-electron-validate:
    if: github.event_name != 'pull_request'
    needs: linux-electron-package
    name: linux-electron-validate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install system dependencies
        run: sudo env SKIP_FFMPEG=1 bash scripts/testing/install_ci_linux_deps.sh
      - name: Install Python dependencies
        run: uv sync --frozen --extra dev
      - name: Install Node dependencies
        run: cd electron && npm install
        timeout-minutes: 10
      - name: Install Playwright browsers
        run: |
          uv run python -m playwright install --with-deps chromium
          cd electron && npx playwright install chromium
        timeout-minutes: 15
      - uses: actions/download-artifact@v5
        with:
          name: splitshot-linux
          path: electron/build
      - name: Validate AppImage package
        run: |
          export LD_LIBRARY_PATH="/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH}"
          artifact=$(ls electron/build/*.AppImage | head -n 1)
          xvfb-run -a uv run python scripts/testing/test_packaged_artifact.py --artifact "$artifact"
      - name: Full E2E test with AppImage package
        run: |
          export LD_LIBRARY_PATH="/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH}"
          artifact=$(ls electron/build/*.AppImage | head -n 1)
          xvfb-run -a uv run python scripts/testing/test_packaged_artifact.py --artifact "$artifact" --script scripts/testing/test_packaged_app_e2e.py
        timeout-minutes: 30
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-linux
          path: artifacts/
