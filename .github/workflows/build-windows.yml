name: Build Windows

on:
  workflow_dispatch:
  workflow_call:

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: choco install ffmpeg -y
      - name: Install Tesseract
        run: choco install tesseract -y
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install managed Python 3.12
        run: uv python install 3.12
      - name: Verify Electron CI inputs
        run: python scripts/testing/verify_electron_ci_inputs.py
      - name: Verify host toolchain
        run: python3 --version; node --version; npm --version; uv --version
      - name: Sync Python dependencies
        run: uv sync --frozen --extra dev --python 3.12
        timeout-minutes: 15
      - name: Verify Clip1 proof fixture
        run: uv run python scripts/testing/verify_clip1_fixture.py docs/Clip1.MP4 --min-shots 1 --min-duration 5
      - name: Install Node dependencies
        run: cd electron && npm install
        timeout-minutes: 10
      - name: Build Electron app
        run: cd electron && npm run build:win
        timeout-minutes: 30
      - name: Verify installer
        run: |
          shopt -s nullglob; found=( electron/build/*.exe )
          [ ${#found[@]} -eq 0 ] && { echo "No NSIS installer"; exit 1; }
          ls -lh "${found[@]}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: splitshot-windows
          path: electron/build/*.exe

  validate:
    needs: package
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install managed Python 3.12
        run: uv python install 3.12
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: choco install ffmpeg -y
      - name: Install Tesseract
        run: choco install tesseract -y
      - name: Verify Electron CI inputs
        run: python scripts/testing/verify_electron_ci_inputs.py
      - name: Sync Python dependencies
        run: uv sync --frozen --extra dev --python 3.12
      - name: Verify Clip1 proof fixture
        run: uv run python scripts/testing/verify_clip1_fixture.py docs/Clip1.MP4 --min-shots 1 --min-duration 5
      - name: Install Node dependencies
        run: cd electron && npm install
      - name: Install Playwright browsers
        run: |
          uv run python -m playwright install --with-deps chromium
          cd electron && npx playwright install chromium
      - uses: actions/download-artifact@v5
        with:
          name: splitshot-windows
          path: electron/build
      - name: Validate installed package
        run: |
          artifact=$(find electron/build -type f -name '*.exe' | head -n 1)
          [ -n "$artifact" ] || { echo "No Windows installer found after artifact download"; exit 1; }
          uv run python scripts/testing/test_packaged_artifact.py --artifact "$artifact"
      - name: Full E2E test with installed package
        env:
          SPLITSHOT_E2E_VIDEO: docs/Clip1.MP4
          SPLITSHOT_E2E_SCOPE: export-proof
          SPLITSHOT_E2E_OCR_PROOF: "1"
          SPLITSHOT_PACKAGED_TESSERACT: tesseract
        run: |
          artifact=$(find electron/build -type f -name '*.exe' | head -n 1)
          [ -n "$artifact" ] || { echo "No Windows installer found after artifact download"; exit 1; }
          uv run python scripts/testing/test_packaged_artifact.py --artifact "$artifact" --script scripts/testing/test_packaged_app_e2e.py
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-windows
          path: artifacts/
