name: Build Windows

on:
  push:
    tags:
      - 'build-windows'
  workflow_dispatch:
  workflow_call:

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install managed Python 3.12
        run: uv python install 3.12
      - name: Verify host toolchain
        run: python3 --version; node --version; npm --version; uv --version; ffmpeg -version | head -n 1
      - name: Sync Python dependencies
        run: uv sync --frozen --extra dev --python 3.12
        timeout-minutes: 15
      - name: Install Node dependencies
        run: cd electron && npm install
        timeout-minutes: 10
      - name: Build Electron app
        run: cd electron && npm run build:win
        timeout-minutes: 30
      - name: Verify installer
        run: |
          shopt -s nullglob; found=( electron/build/*.exe )
          [ ${#found[@]} -eq 0 ] && { echo "No NSIS installer"; exit 1; }
          ls -lh "${found[@]}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: splitshot-windows
          path: electron/build/*.exe
      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob; exes=( electron/build/*.exe )
          for f in "${exes[@]}"; do
            gh release upload v1 "$f" --clobber && echo "Uploaded $f to v1"
          done
