name: Manual Diagnostics

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install Linux runtime dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo bash scripts/testing/install_ci_linux_deps.sh

      - name: Install FFmpeg (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install ffmpeg -y

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Runtime check
        run: uv run splitshot --check

      - name: Run tests
        id: run_tests
        continue-on-error: true
        run: >
          uv run python scripts/testing/run_test_suite.py
          --mode all-together
          --format table
          --raw-output artifacts/test-run.raw.txt
          --json-output artifacts/test-run.json
          --suite analysis
          --suite cli
          --suite export
          --suite media
          --suite persistence
          --suite presentation
          --suite scoring
          --suite benchmarks
          --suite scripts

      - name: Print test raw output on failure
        if: steps.run_tests.outcome == 'failure'
        run: python -c "from pathlib import Path; print(Path('artifacts/test-run.raw.txt').read_text(encoding='utf-8'))"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            artifacts/test-run.raw.txt
            artifacts/test-run.json

      - name: Fail when tests fail
        if: steps.run_tests.outcome == 'failure'
        run: exit 1

  browser-audit:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install Linux runtime dependencies
        run: sudo bash scripts/testing/install_ci_linux_deps.sh

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Install Playwright browsers and Linux deps
        run: uv run python -m playwright install --with-deps chromium firefox webkit

      - name: Run browser test suite
        run: uv run pytest tests/browser -q
