name: Manual Diagnostics

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install Linux runtime dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo bash scripts/testing/install_ci_linux_deps.sh

      - name: Install FFmpeg (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install ffmpeg -y

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Runtime check
        run: uv run splitshot --check

      - name: Run tests
        id: run_tests
        continue-on-error: true
        run: >
          uv run python scripts/testing/run_test_suite.py
          --mode all-together
          --format table
          --raw-output artifacts/test-run.raw.txt
          --json-output artifacts/test-run.json
          --suite analysis
          --suite cli
          --suite export
          --suite media
          --suite persistence
          --suite presentation
          --suite scoring
          --suite benchmarks
          --suite scripts

      - name: Print test raw output on failure
        if: steps.run_tests.outcome == 'failure'
        run: python -c "from pathlib import Path; print(Path('artifacts/test-run.raw.txt').read_text(encoding='utf-8'))"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            artifacts/test-run.raw.txt
            artifacts/test-run.json

      - name: Fail when tests fail
        if: steps.run_tests.outcome == 'failure'
        run: exit 1

  electron-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build-command: npm run build:linux
            artifact-glob: electron/build/*.AppImage
            artifact-name: Linux AppImage
          - os: macos-latest
            build-command: npm run build:mac
            artifact-glob: electron/build/*.dmg
            artifact-name: macOS DMG
          - os: windows-latest
            build-command: npm run build:win
            artifact-glob: electron/build/*.exe
            artifact-name: Windows NSIS
    runs-on: ${{ matrix.os }}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux runtime dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo bash scripts/testing/install_ci_linux_deps.sh

      - name: Install FFmpeg (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install ffmpeg -y

      - name: Install Python dependencies
        run: uv sync --frozen --extra dev

      - name: Install Node dependencies
        run: cd electron && npm install
        timeout-minutes: 10

      - name: Prepare macOS signing certificate
        if: matrix.os == 'macos-latest'
        env:
          MAC_CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MAC_CERT_BASE64}" ]; then
            echo "Missing MAC_CERT_BASE64 secret"
            exit 1
          fi
          if [ -z "${MAC_CERT_PASSWORD}" ]; then
            echo "Missing MAC_CERT_PASSWORD secret"
            exit 1
          fi

          tmp_dir="$(mktemp -d)"
          cert_file="${tmp_dir}/developer-id.p12"
          keychain_file="${tmp_dir}/splitshot-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24 | tr -d '\n')"

          CERT_FILE="${cert_file}" MAC_CERT_BASE64="${MAC_CERT_BASE64}" python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["CERT_FILE"]).write_bytes(base64.b64decode(os.environ["MAC_CERT_BASE64"]))
          PY

          openssl pkcs12 -in "${cert_file}" -info -noout -passin env:MAC_CERT_PASSWORD >/dev/null

          security create-keychain -p "${keychain_password}" "${keychain_file}"
          security unlock-keychain -p "${keychain_password}" "${keychain_file}"
          security set-keychain-settings "${keychain_file}"
          security list-keychains -d user -s "${keychain_file}" $(security list-keychains -d user | tr -d '"')
          if ! security import "${cert_file}" -k "${keychain_file}" -T /usr/bin/codesign -T /usr/bin/productbuild -P "${MAC_CERT_PASSWORD}"; then
            echo "macOS rejected the .p12 during security import."
            echo "Re-export the Developer ID Application certificate from Keychain Access and confirm the private key is included."
            exit 1
          fi
          security find-identity -v -p codesigning "${keychain_file}"

          {
            echo "MAC_CERT_FILE=${cert_file}"
            echo "MAC_CERT_KEYCHAIN=${keychain_file}"
            echo "MAC_CERT_TMPDIR=${tmp_dir}"
            echo "MAC_CERT_PASSWORD=${MAC_CERT_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Configure macOS notarization credentials
        if: matrix.os == 'macos-latest'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_API_KEY}" ] || [ -n "${APPLE_API_KEY_ID}" ] || [ -n "${APPLE_API_ISSUER}" ]; then
            if [ -z "${APPLE_API_KEY}" ] || [ -z "${APPLE_API_KEY_ID}" ] || [ -z "${APPLE_API_ISSUER}" ]; then
              echo "APPLE_API_KEY, APPLE_API_KEY_ID, and APPLE_API_ISSUER must all be set together"
              exit 1
            fi
            {
              echo "APPLE_API_KEY_ID=${APPLE_API_KEY_ID}"
              echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}"
              echo "APPLE_API_KEY<<__SPLITSHOT_API_KEY__"
              printf '%s\n' "${APPLE_API_KEY}"
              echo "__SPLITSHOT_API_KEY__"
            } >> "${GITHUB_ENV}"
          elif [ -n "${APPLE_ID}" ] || [ -n "${APPLE_APP_SPECIFIC_PASSWORD}" ] || [ -n "${APPLE_TEAM_ID}" ]; then
            if [ -z "${APPLE_ID}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD}" ] || [ -z "${APPLE_TEAM_ID}" ]; then
              echo "APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID must all be set together"
              exit 1
            fi
            {
              echo "APPLE_ID=${APPLE_ID}"
              echo "APPLE_APP_SPECIFIC_PASSWORD=${APPLE_APP_SPECIFIC_PASSWORD}"
              echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}"
            } >> "${GITHUB_ENV}"
          else
            echo "No notarization credentials configured; build will sign but skip notarization."
          fi

      - name: Build Electron app
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            export CSC_LINK="${MAC_CERT_FILE}"
            export CSC_KEY_PASSWORD="${MAC_CERT_PASSWORD}"
          fi
          cd electron
          ${{ matrix.build-command }}
        timeout-minutes: 30

      - name: Extract or install package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-glx 2>/dev/null || sudo apt-get install -y --no-install-recommends libegl1 libgl1 2>/dev/null || true
          unpacked="electron/build/linux-unpacked/splitshot"
          if [ ! -f "${unpacked}" ]; then
            echo "No linux-unpacked/splitshot found at ${unpacked}"
            echo "Checking electron/build/..."
            ls electron/build/
            exit 1
          fi
          chmod +x "${unpacked}"
          echo "APP_EXECUTABLE=${unpacked}" >> "${GITHUB_ENV}"
          echo "E2E_PREFIX=env LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu xvfb-run -a" >> "${GITHUB_ENV}"
          echo "E2E_APP_ARGS=--no-sandbox" >> "${GITHUB_ENV}"

      - name: Install package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=( electron/build/*.exe )
          if [ ${#installers[@]} -eq 0 ]; then
            echo "No Windows installer found"
            exit 1
          fi
          "${installers[0]}" /S
          sleep 5
          installed_exe=$(find "/c/Program Files" "/c/Program Files (x86)" -name "SplitShot.exe" -path "*/SplitShot/*" 2>/dev/null | head -1)
          if [ -z "${installed_exe}" ]; then
            installed_exe=$(find "/c/Users" -name "SplitShot.exe" -path "*/AppData/Local/*" 2>/dev/null | head -1)
          fi
          if [ -z "${installed_exe}" ]; then
            echo "Could not find installed SplitShot.exe"
            echo "Searching common paths..."
            ls -la "/c/Program Files/SplitShot/" 2>/dev/null || echo "Not in Program Files"
            ls -la "/c/Program Files (x86)/SplitShot/" 2>/dev/null || echo "Not in Program Files (x86)"
            exit 1
          fi
          echo "APP_EXECUTABLE=${installed_exe}" >> "${GITHUB_ENV}"
          echo "E2E_PREFIX=" >> "${GITHUB_ENV}"
          echo "E2E_APP_ARGS=" >> "${GITHUB_ENV}"

      - name: Mount package (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=( electron/build/*.dmg )
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "No DMG found"
            exit 1
          fi
          mount_point=$(mktemp -d)
          hdiutil attach -nobrowse -mountpoint "${mount_point}" "${dmgs[0]}"
          app_exec="${mount_point}/SplitShot.app/Contents/MacOS/SplitShot"
          if [ ! -f "${app_exec}" ]; then
            echo "Executable not found in DMG at ${app_exec}"
            hdiutil detach "${mount_point}"
            exit 1
          fi
          codesign -dv "${app_exec}"
          echo "APP_EXECUTABLE=${app_exec}" >> "${GITHUB_ENV}"
          echo "E2E_PREFIX=" >> "${GITHUB_ENV}"
          echo "E2E_APP_ARGS=" >> "${GITHUB_ENV}"
          echo "E2E_DMG_VOLUME=${mount_point}" >> "${GITHUB_ENV}"

      - name: Full E2E test against installed app (with video)
        run: ${E2E_PREFIX} uv run python scripts/testing/test_packaged_app_e2e.py --app "${APP_EXECUTABLE}" -- ${E2E_APP_ARGS}
        timeout-minutes: 15

      - name: Upload E2E test video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-video-${{ matrix.os }}
          path: artifacts/e2e-*.mp4
          if-no-files-found: warn

      - name: Verify installer artifact
        run: |
          shopt -s nullglob
          found=( ${{ matrix.artifact-glob }} )
          if [ ${#found[@]} -eq 0 ]; then
            echo "No ${{ matrix.artifact-name }} found in electron/build/"
            exit 1
          fi
          for f in "${found[@]}"; do
            ls -lh "$f"
          done

      - name: Cleanup DMG mount (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          if [ -n "${E2E_DMG_VOLUME:-}" ]; then
            hdiutil detach "${E2E_DMG_VOLUME}" 2>/dev/null || true
          fi

      - name: Cleanup macOS signing artifacts
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          if [ -n "${MAC_CERT_KEYCHAIN:-}" ] && [ -f "${MAC_CERT_KEYCHAIN}" ]; then
            security delete-keychain "${MAC_CERT_KEYCHAIN}" || true
          fi
          if [ -n "${MAC_CERT_TMPDIR:-}" ] && [ -d "${MAC_CERT_TMPDIR}" ]; then
            rm -rf "${MAC_CERT_TMPDIR}"
          fi

  browser-audit:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install Linux runtime dependencies
        run: sudo bash scripts/testing/install_ci_linux_deps.sh

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Install Playwright browsers and Linux deps
        run: uv run python -m playwright install --with-deps chromium firefox webkit

      - name: Run browser test suite
        run: uv run pytest tests/browser -q
